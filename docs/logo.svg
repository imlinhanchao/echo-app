<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Echo Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="55%" stop-color="#111114" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#D4AE74" stop-opacity="0.18" />
      <stop offset="52%" stop-color="#D4AE74" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#D4AE74" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="barOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A978" />
      <stop offset="100%" stop-color="#8B693B" />
    </linearGradient>

    <linearGradient id="barInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C696" />
      <stop offset="100%" stop-color="#B68D52" />
    </linearGradient>

    <linearGradient id="barCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F0E4" />
      <stop offset="48%" stop-color="#DEC08F" />
      <stop offset="100%" stop-color="#BE9558" />
    </linearGradient>

    <clipPath id="badgeClip">
      <rect x="6" y="6" width="116" height="116" rx="28" />
    </clipPath>

    <filter id="barShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded squircle badge -->
  <g clip-path="url(#badgeClip)">
    <rect x="6" y="6" width="116" height="116" fill="url(#bgGrad)" />
    <circle cx="64" cy="59.36" r="51" fill="url(#auraGlow)" />
  </g>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#D4AE74" stroke-opacity="0.22" stroke-width="1.2" />

  <!-- Concentric acoustic rings -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#D4AE74" stroke-opacity="0.11" stroke-width="1.2" />
  <circle cx="64" cy="64" r="29.5" fill="none" stroke="#D4AE74" stroke-opacity="0.20" stroke-width="1.4" />

  <!-- 5 brushed champagne-gold vertical bars -->
  <g filter="url(#barShadow)">
    <rect x="40" y="54.25" width="6" height="19.5" rx="3" fill="url(#barOuter)" />
    <rect x="50.5" y="46" width="6" height="36" rx="3" fill="url(#barInner)" />
    <rect x="61" y="38" width="6" height="52" rx="3" fill="url(#barCenter)" />
    <rect x="71.5" y="46" width="6" height="36" rx="3" fill="url(#barInner)" />
    <rect x="82" y="54.25" width="6" height="19.5" rx="3" fill="url(#barOuter)" />
  </g>
</svg>
