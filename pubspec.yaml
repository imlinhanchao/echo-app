name: echo
description: "Echo · 回声 — 跨平台听看一体书客户端（Flutter）"
publish_to: 'none'
version: 0.4.1+401

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  sherpa_onnx: ^1.12.11
  file_picker: ^8.1.2
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/design-tokens.json
    - assets/discover-rules.json

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0D0E10"
    theme_color: "#D4AE74"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

